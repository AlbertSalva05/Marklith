services:
  - type: web
    name: marklith
    runtime: static
    buildCommand: mkdir -p vendor/tesseract/lang && curl -fsSL -o vendor/tesseract/lang/eng.traineddata.gz https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0_best_int/eng.traineddata.gz
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /site.webmanifest
        name: Content-Type
        value: application/manifest+json
      - path: /site.webmanifest
        name: Cache-Control
        value: public, max-age=86400
      - path: /robots.txt
        name: Cache-Control
        value: public, max-age=86400
      - path: /sitemap.xml
        name: Cache-Control
        value: no-cache
      - path: /support.js
        name: Cache-Control
        value: no-cache
      - path: /src/*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /vendor/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /vendor/*
        name: Access-Control-Allow-Origin
        value: "*"
